<!-- =========================================
     SK FURNITURE MARKET
     DESKTOP / LAPTOP HEADER
     1025px AND ABOVE
========================================= -->

<style>
    /* =========================================
       DESKTOP HEADER
    ========================================= */
    
    
    header#masthead {
  height: 90px;
}

    .sk-desktop-header {
        display: block;
        width: 100%;
        position: relative;
        z-index: 9999;
        font-family: Arial, sans-serif;
    }

    .sk-desktop-header * {
        box-sizing: border-box;
    }

    /* Hide on tablet/mobile */
    @media (max-width: 1024px) {
        .sk-desktop-header {
            display: none !important;
        }
    }

    /* =========================================
       TOP ANNOUNCEMENT BAR
    ========================================= */

    .sk-desktop-topbar {
        width: 100%;
        background: #2B2118;
        color: #ffffff;
        padding: 9px 20px;
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.3px;
    }

    .sk-desktop-topbar-inner {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
    }

    .sk-desktop-topbar-divider {
        opacity: 0.5;
    }

    /* =========================================
       MAIN HEADER
    ========================================= */

    .sk-desktop-main {
        width: 100%;
        background: #FAF8F3;
        border-bottom: 1px solid #e7dfd4;
    }

    .sk-desktop-container {
        width: min(1400px, 94%);
        min-height: 82px;
        margin: 0 auto;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    /* =========================================
       LOGO
    ========================================= */

    .sk-desktop-logo {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        text-decoration: none;
    }

    .sk-desktop-logo img {
        display: block;
        width: 165px;
        height: auto;
        max-height: 62px;
        object-fit: contain;
    }

    /* =========================================
       NAVIGATION
    ========================================= */

    .sk-desktop-navigation {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 27px;
        flex: 1;
    }

    .sk-desktop-nav-link {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #2B2118;
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
        padding: 11px 0;
        transition: color 0.3s ease;
    }

    .sk-desktop-nav-link:hover,
    .sk-desktop-nav-link.active {
        color: #B8793E;
    }

    .sk-desktop-nav-link::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 10px;

        width: 0;
        height: 1px;

        background: #B8793E;

        transition: width 0.3s ease;
    }

    .sk-desktop-nav-link:hover::after,
    .sk-desktop-nav-link.active::after {
        width: 100%;
    }

    /* =========================================
       SHOP DROPDOWN
    ========================================= */

    .sk-desktop-dropdown {
        position: relative;
    }

    .sk-desktop-dropdown-arrow {
        width: 15px;
        height: 15px;
        transition: transform 0.3s ease;
    }

    .sk-desktop-dropdown:hover .sk-desktop-dropdown-arrow {
        transform: rotate(180deg);
    }

    .sk-desktop-dropdown-menu {
        position: absolute;

        top: calc(100% - 5px);
        left: 50%;

        width: 720px;

        transform: translateX(-20%) translateY(0px);

        background: #ffffff;

        border: 1px solid #e7dfd4;
        border-radius: 4px;

        padding: 30px;

        display: grid;
        grid-template-columns: repeat(3, 1fr) 1.2fr;

        gap: 25px;

        opacity: 0;
        visibility: hidden;

        transition:
            opacity 0.25s ease,
            transform 0.25s ease,
            visibility 0.25s ease;

        box-shadow: 0 18px 45px rgba(43, 33, 24, 0.12);
    }

    .sk-desktop-dropdown:hover .sk-desktop-dropdown-menu {
        opacity: 1;
        visibility: visible;

        transform: translateX(-20%) translateY(0);
    }

    .sk-desktop-dropdown-column {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .sk-desktop-dropdown-column h4 {
        margin: 0 0 8px;

        color: #2B2118;

        font-family: Georgia, serif;
        font-size: 16px;
    }

    .sk-desktop-dropdown-column a {
        color: #6c6259;
        text-decoration: none;
        font-size: 13px;

        transition: color 0.25s ease;
    }

    .sk-desktop-dropdown-column a:hover {
        color: #B8793E;
    }

    /* =========================================
       FEATURE BOX
    ========================================= */

    .sk-desktop-feature {
        background: #2B2118;
        color: #ffffff;

        padding: 24px;

        min-height: 180px;

        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .sk-desktop-feature span {
        font-size: 10px;
        letter-spacing: 2px;
        color: #d7a36b;
        margin-bottom: 10px;
    }

    .sk-desktop-feature h3 {
        margin: 0 0 15px;

        color: #ffffff;

        font-family: Georgia, serif;
        font-size: 22px;
        line-height: 1.2;
    }

    .sk-desktop-feature a {
        color: #ffffff;
        text-decoration: none;
        font-size: 12px;
    }

    /* =========================================
       HEADER ACTIONS
    ========================================= */

    .sk-desktop-actions {
        display: flex;
        align-items: center;
        gap: 13px;

        flex-shrink: 0;
    }

    .sk-desktop-search {
        width: 310px;
        height: 42px;

        display: flex;
        align-items: center;

        background: #ffffff;

        border: 1px solid #ded5c9;
        border-radius: 4px;

        overflow: hidden;
    }

    .sk-desktop-search input {
        width: 100%;
        height: 100%;

        border: 0;
        outline: 0;

        padding: 0 12px;

        background: transparent;

        color: #2B2118;
        font-size: 13px;
    }

    .sk-desktop-search input::placeholder {
        color: #91877c;
    }

    .sk-desktop-search button {
        width: 40px;
		height: 100%;
		background: transparent;
		display: flex;
		align-items: center;
		justify-content: center;
		cursor: pointer;
		color: #2B2118;
		padding: 10px;
		border-radius: 0px;
		border-left: 1px solid #aaa;
    }

    .sk-desktop-search button svg {
        width: 19px;
        height: 19px;
    }

    .sk-desktop-action {
        width: 42px;
        height: 42px;

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;

        color: #2B2118;
        text-decoration: none;

        border: 1px solid #ded5c9;
        border-radius: 50%;

        transition: all 0.25s ease;
    }

    .sk-desktop-action:hover {
        color: #ffffff;
        background: #2B2118;
        border-color: #2B2118;
    }

    .sk-desktop-action svg {
        width: 18px;
        height: 18px;

        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
    }

    /* =========================================
       CART COUNT
    ========================================= */

    .sk-desktop-cart-count {
        position: absolute;

        top: -5px;
        right: -4px;

        min-width: 17px;
        height: 17px;

        padding: 0 4px;

        border-radius: 20px;

        background: #B8793E;
        color: #ffffff;

        font-size: 9px;
        font-weight: 600;

        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>
