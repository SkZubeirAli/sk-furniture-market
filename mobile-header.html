    align-items: center;

  .sk-mobile-logo {

    height: 50px;

    display: flex;

    align-items: center;

    justify-content: flex-start;

    flex-shrink: 0;

    text-decoration: none;
  }

  .sk-mobile-logo img {
    width: 50px;

    height: 50px;

    object-fit: contain;

    display: block;
  }

  /* =========================================
        RIGHT ACTIONS
      ========================================= */

  .sk-mobile-actions {
    width: 50%;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 7px;
  }

  .sk-mobile-action {

    height: 43px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    border: 1px solid #ddd4c8;

    border-radius: 50%;

    background: transparent;

    color: #2b2118;

    cursor: pointer;

    text-decoration: none;

    padding: 0;

    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }

  .sk-mobile-action:hover {
    background: #2b2118;

    border-color: #2b2118;

    color: #ffffff;
  }

  .sk-mobile-action svg {
    width: 20px;

    height: 20px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.7;

    stroke-linecap: round;

    stroke-linejoin: round;
  }

  /* =========================================
        CART COUNT
      ========================================= */

  .sk-mobile-cart-count {

    top: -5px;

    right: -3px;

    color: #ffffff;

    font-size: 9px;

    font-weight: 600;

    display: flex;

    align-items: center;

    justify-content: center;
  }

  .sk-mobile-search-panel {

    top: 0;

    left: 0;

    padding: 18px 15px;

    box-shadow: 0 12px 35px rgba(43, 33, 24, 0.12);

    transform: translateY(-110%);

    opacity: 0;

    visibility: hidden;

    transition: transform 0.35s ease, opacity 0.3s ease, visibility 0.3s ease;

    z-index: 100001;
  }

  .sk-mobile-search-panel.active {
    transform: translateY(0);

    opacity: 1;

    visibility: visible;
  }

    align-items: center;

    justify-content: space-between;

    margin-bottom: 14px;

    color: #2b2118;

    font-size: 15px;

    font-weight: 600;

    height: 34px;

    color: #2b2118;

    line-height: 1;

    cursor: pointer;
    padding: 0px;
    margin-top: 10px;

    height: 48px;

    display: flex;

    border-radius: 5px;

    justify-content: center;
  }

    height: 19px;

    stroke: currentColor;

    stroke-width: 2;
  }

  .sk-mobile-overlay {

    height: 100%;

    opacity: 0;

    visibility: hidden;

    transition: opacity 0.3s ease, visibility 0.3s ease;

    z-index: 10;

  .sk-mobile-overlay.active {
    opacity: 1;

    visibility: visible;
  }

      ========================================= */

  .sk-mobile-drawer {

    top: 0;

    right: 0;

    width: 65%;

    max-width: 420px;

    height: 100vh;

    height: 100dvh;

    z-index: 11;

    overflow-y: auto;

    box-shadow: -15px 0 45px rgba(0, 0, 0, 0.15);

  .sk-mobile-drawer.active {
    transform: translateX(0);

  .sk-mobile-submenu {

    overflow: hidden;

    padding-left: 8px;
  }

    font-size: 13px;
